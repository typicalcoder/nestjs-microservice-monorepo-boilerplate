name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:ci

      # Fail-fast on threshold drop happens inside Jest (coverageThreshold
      # in jest.config.js); this step only uploads artifacts for inspection.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Summarize coverage in job output
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const row = (k) => '| ' + k + ' | ' + s[k].pct + '% | ' + s[k].covered + '/' + s[k].total + ' |';
              const out = [
                '## Coverage',
                '',
                '| Metric | % | Covered |',
                '|---|---|---|',
                row('statements'),
                row('branches'),
                row('functions'),
                row('lines'),
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            "
          fi
