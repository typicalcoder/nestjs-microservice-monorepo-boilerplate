name: CI/CD
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service or task (kebab-case, matches nest-cli.json project name)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gateway
          - user
          - task-user-purge
          - task-db-migrate

      stage:
        description: 'Stage'
        required: true
        default: 'all'
        type: choice
        options:
          - dev
          - prod
          - all

env:
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_REPO: 'lix-su/argo'
  PROJECT: 'app-be'
  # Long-running services that accept traffic / consume RPC.
  ALL_SERVICES: gateway,user
  # K8s CronJob / Job entry points — same Dockerfile, different entry module.
  # Every entry here must exist as a project in nest-cli.json.
  ALL_TASKS: task-user-purge,task-db-migrate
  ALL_STAGES: dev,prod

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.set-matrix.outputs.full-matrix }}
      services-matrix: ${{ steps.set-matrix.outputs.services-matrix }}
    steps:
      - id: set-matrix
        run: |
          IFS=',' read -r -a SERVICES <<< "${ALL_SERVICES}"
          IFS=',' read -r -a TASKS <<< "${ALL_TASKS}"
          IFS=',' read -r -a STAGES <<< "${ALL_STAGES}"

          # Artifact = services + tasks. Dockerfile treats them identically.
          ARTIFACTS=("${SERVICES[@]}" "${TASKS[@]}")

          # Filter by workflow input. `all` keeps the full artifact list; a
          # specific name narrows to just that artifact.
          if [[ "${{ github.event.inputs.service }}" != "all" ]]; then
            ARTIFACTS=("${{ github.event.inputs.service }}")
          fi
          if [[ "${{ github.event.inputs.stage }}" != "all" ]]; then
            STAGES=("${{ github.event.inputs.stage }}")
          fi

          # deploy matrix: artifact × stage
          FULL_MATRIX=$(jq -n \
            --argjson artifacts "$(printf '%s\n' "${ARTIFACTS[@]}" | jq -R . | jq -s .)" \
            --argjson stages "$(printf '%s\n' "${STAGES[@]}" | jq -R . | jq -s .)" \
            '{include: [$artifacts[] as $s | $stages[] as $st | {service: $s, stage: $st}] }')

          # build matrix: one row per artifact (same image for all stages)
          SERVICES_MATRIX=$(printf '%s\n' "${ARTIFACTS[@]}" | jq -R . | jq -s '{service: .}')

          {
            echo "full-matrix<<EOF"
            echo "$FULL_MATRIX"
            echo "EOF"
            echo "services-matrix<<EOF"
            echo "$SERVICES_MATRIX"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Generated full matrix:"
          echo "$FULL_MATRIX"
          echo "Generated build matrix:"
          echo "$SERVICES_MATRIX"

  build-and-push:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.services-matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            RELEASE_TAG=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}

  deploy-argo:
    needs: [build-and-push, set-matrix]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.full-matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/update-image
        with:
          registry: ghcr.io
          repo: ${{ env.DEPLOY_REPO }}
          service: ${{ matrix.service }}
          tag: ${{ env.IMAGE_TAG }}
          ssh-key: "${{ secrets.SSH_KEY }}"
          kustomize-path: ${{ matrix.stage }}
          image: ${{ env.PROJECT }}-${{ matrix.service }}-image
